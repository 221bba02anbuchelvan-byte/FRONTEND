<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Basics</title>

    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;

            width: 80%;
            height: 300px;
            margin: 50px auto;
            border: 2px solid black;
        }

        .box {
            width: 120px;
            height: 120px;
            background-color: lightblue;
            border: 2px solid blue;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 style="text-align: center;">Flexbox Basics</h1>

    <div class="flex-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>
</html>
