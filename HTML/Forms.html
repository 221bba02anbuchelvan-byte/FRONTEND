<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }
        .form-container {
            max-width: 450px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .radio-group, .checkbox-group {
            margin-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Registration Form</h2>
        
        <!-- Form structure using action and method -->
        <form action="/submit-form" method="POST">
            
            <!-- Full Name Input (Text) -->
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </div>

            <!-- Email Input with HTML5 validation -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <!-- Age Input (Number with range limits) -->
            <div class="form-group">
                <label for="age">Age (Numeric Input):</label>
                <input type="number" id="age" name="age" min="18" max="100" placeholder="18 - 100" required>
            </div>

            <!-- Radio Buttons (Single Choice) -->
            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </div>
            </div>

            <!-- Checkboxes (Multiple Choices) -->
            <div class="form-group">
                <label>Hobbies:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="coding" name="hobbies" value="coding">
                    <label for="coding">Coding</label>

                    <input type="checkbox" id="sports" name="hobbies" value="sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music" name="hobbies" value="music">
                    <label for="music">Music</label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Registration</button>
            
        </form>
    </div>

</body>
</html>
